name: Central tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts-and-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[drawing]' pytest
      - run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test review-ui/tests/*.test.js
