[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rakathon-report-extractor"
version = "0.1.0"
description = "Offline, evidence-backed text-report extraction prototype"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.14,<3"]

[project.scripts]
report-extractor = "report_extractor.cli:main"
central = "central.cli:main"

[tool.setuptools.packages.find]
include = ["report_extractor*", "central*"]
